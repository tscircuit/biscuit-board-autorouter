80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.014073170731707316"/></g><g><rect data-type="rect" data-label="" data-x="-1.7142857142857144" data-y="0.75" x="307.88561525129984" y="346.18717504332756" width="40.604109928200046" height="35.52859618717508" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.014073170731707316"/></g><g><rect data-type="rect" data-label="" data-x="-1.1428571428571428" data-y="0.75" x="348.4897251794999" y="346.18717504332756" width="40.604109928200046" height="35.52859618717508" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.014073170731707316"/></g><g><rect data-type="rect" data-label="" data-x="-0.5714285714285716" data-y="0.75" x="389.09383510769993" y="346.18717504332756" width="40.604109928200046" height="35.52859618717508" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.014073170731707316"/></g><g><rect data-type="rect" data-label="" data-x="0" data-y="0.75" x="429.6979450359" y="346.18717504332756" width="40.604109928200046" height="35.52859618717508" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.014073170731707316"/></g><g><rect data-type="rect" data-label="" data-x="0.5714285714285712" data-y="0.75" x="470.3020549641" y="346.18717504332756" width="40.604109928200046" height="35.52859618717508" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.014073170731707316"/></g><g><rect data-type="rect" data-label="" data-x="1.1428571428571428" data-y="0.75" x="510.9061648923" y="346.18717504332756" width="40.6041099282001" height="35.52859618717508" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.014073170731707316"/></g><g><rect data-type="rect" data-label="" data-x="1.714285714285714" data-y="0.75" x="551.5102748205002" y="346.18717504332756" width="40.60410992819993" height="35.52859618717508" fill="rgba(80,80,80,0.12)" stroke="rgba(80,80,80,0.35)" stroke-width="0.014073170731707316"/></g><g id="crosshair" style="display: none"><line id="crosshair-h" y1="0" y2="600" stroke="#666" stroke-width="0.5"/><line id="crosshair-v" x1="0" x2="900" stroke="#666" stroke-width="0.5"/><text id="coordinates" font-family="monospace" font-size="12" fill="#666"></text></g><script><![CDATA[
              document.currentScript.parentElement.addEventListener('mousemove', (e) => {
                const svg = e.currentTarget;
                const rect = svg.getBoundingClientRect();
                const x = e.clientX - rect.left;
                const y = e.clientY - rect.top;
                const crosshair = svg.getElementById('crosshair');
                const h = svg.getElementById('crosshair-h');
                const v = svg.getElementById('crosshair-v');
                const coords = svg.getElementById('coordinates');
                
                crosshair.style.display = 'block';
                h.setAttribute('x1', '0');
                h.setAttribute('x2', '900');
                h.setAttribute('y1', y);
                h.setAttribute('y2', y);
                v.setAttribute('x1', x);
                v.setAttribute('x2', x);
                v.setAttribute('y1', '0');
                v.setAttribute('y2', '600');

                // Calculate real coordinates using inverse transformation
                const matrix = {"a":71.0571923743501,"c":0,"e":450,"b":0,"d":-71.0571923743501,"f":417.24436741767767};
                // Manually invert and apply the affine transform
                // Since we only use translate and scale, we can directly compute:
                // x' = (x - tx) / sx
                // y' = (y - ty) / sy
                const sx = matrix.a;
                const sy = matrix.d;
                const tx = matrix.e; 
                const ty = matrix.f;
                const realPoint = {
                  x: (x - tx) / sx,
                  y: (y - ty) / sy // Flip y back since we used negative scale
                }
                
                coords.textContent = `(${realPoint.x.toFixed(2)}, ${realPoint.y.toFixed(2)})`;
                coords.setAttribute('x', (x + 5).toString());
                coords.setAttribute('y', (y - 5).toString());
              });
              document.currentScript.parentElement.addEventListener('mouseleave', () => {
                document.currentScript.parentElement.getElementById('crosshair').style.display = 'none';
              });
            ]]></script></svg>